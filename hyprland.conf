# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

$activeBorderColor = rgba(c87d2af5) rgba(fffaf0f5) 45deg
$inactiveBorderColor = rgba(6b5650f5)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
    gaps_in = 7
    gaps_out = 14
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 14
    rounding_power = 2
    blur {
        enabled = true
        size = 5
        passes = 2
      }
    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(33282db5)
        color_inactive = rgba(292025d8)
      }
  }

animations {
    enabled = true

    # Warm, cushioned motion that feels soft rather than flashy.
    bezier = waffleSmooth, 0.24, 0.9, 0.2, 1.0
    bezier = waffleSettle, 0.2, 1.0, 0.3, 1.0
    bezier = waffleFade, 0.18, 0.0, 0.12, 1.0

    animation = windows, 1, 5, waffleSmooth
    animation = windowsIn, 1, 5, waffleSettle, popin 8%
    animation = windowsOut, 1, 4, waffleFade, popin 82%
    animation = windowsMove, 1, 5, waffleSmooth

    animation = border, 1, 6, waffleFade
    animation = fade, 1, 5, waffleFade
    animation = layers, 1, 5, waffleSettle, slidefade
    animation = layersIn, 1, 5, waffleSettle, slidefade
    animation = layersOut, 1, 4, waffleFade, fade
    animation = workspaces, 1, 4, waffleSmooth, slidefade
}
